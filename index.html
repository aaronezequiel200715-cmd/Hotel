<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel - Bienvenido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        p {
            color: #666;
            line-height: 1.8;
            margin: 15px 0;
        }

        .info {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            text-align: left;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        a {
            padding: 15px 30px;
            font-size: 1em;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .button-group { flex-direction: column; }
            a { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏨 Hotel</h1>
        <p class="subtitle">
            Bienvenido a tu aplicación Hotel
        </p>

        <div class="info">
            <h2 style="color: #333; margin-bottom: 15px;">ℹ️ Información</h2>
            <p>Tu proyecto Hotel está desplegado y funcionando correctamente en Vercel.</p>
            <p>Puedes comenzar a agregar tu contenido y funcionalidades.</p>
        </div>

        <div class="button-group">
            <a href="https://github.com/aaronezequiel200715-cmd/Hotel" class="btn-primary" target="_blank">Ver en GitHub →</a>
            <a href="https://vercel.com" class="btn-secondary" target="_blank">Dashboard de Vercel</a>
        </div>

        <p style="margin-top: 40px; color: #999; font-size: 0.9em;">
            Desplegado con ❤️ en <strong>Vercel</strong>
        </p>
    </div>
</body>
</html>
